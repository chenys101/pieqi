<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pieqi · 需求拆分 · 宽屏嵌入 / 窄屏 URL</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #161920;
      --elevated: #1c2028;
      --inset: #12151a;
      --border: #2a303b;
      --border-strong: #3a4250;
      --text: #e8eaef;
      --text-2: #a8b0bd;
      --muted: #7a8494;
      --accent: #5b8def;
      --accent-soft: rgba(91, 141, 239, 0.12);
      --warning: #d4a017;
      --warning-soft: rgba(212, 160, 23, 0.12);
      --warning-border: rgba(212, 160, 23, 0.4);
      --error: #e35d6a;
      --success: #3dba7a;
      --info: #5bb8d4;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* —— chrome：强制视口 + 场景 —— */
    .lab {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 40;
    }
    .lab label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
    .lab select, .lab button {
      background: var(--elevated); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; cursor: pointer;
    }
    .lab button.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .lab .url {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      padding: 4px 8px; border-radius: 6px; background: var(--inset); border: 1px solid var(--border);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hint { color: var(--muted); font-size: 11px; }

    /* —— 模拟设备框 —— */
    .stage-wrap { padding: 12px; min-height: calc(100% - 48px); }
    .device {
      margin: 0 auto; background: var(--bg); border: 1px solid var(--border-strong);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
      height: calc(100vh - 72px); box-shadow: 0 12px 40px rgba(0,0,0,.35);
      transition: width .2s ease;
    }
    body.force-wide .device { width: min(1180px, 100%); }
    body.force-narrow .device { width: min(390px, 100%); }
    body.force-auto .device { width: 100%; max-width: 1180px; }

    .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    /* header */
    .hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: rgba(22,25,32,.85);
      backdrop-filter: blur(8px);
    }
    .hdr h1 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn {
      border: none; background: transparent; color: var(--muted); border-radius: 6px;
      padding: 4px 6px; cursor: pointer;
    }
    .icon-btn:hover { background: var(--elevated); color: var(--text); }
    .pill {
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    .btn {
      border: 1px solid var(--border); background: var(--elevated); border-radius: 8px;
      padding: 6px 10px; cursor: pointer; font-size: 12px;
    }
    .btn:hover { border-color: var(--border-strong); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent); border-color: transparent; color: #fff; font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    .scroll { flex: 1; min-height: 0; overflow: auto; }
    .col { max-width: 42rem; margin: 0 auto; padding: 16px 12px 32px; }
    body.force-wide .req-layout .col,
    body:not(.force-narrow) .req-layout.is-wide .col { max-width: none; margin: 0; padding: 0; }

    /* 宽屏：左需求 + 右嵌入会话 */
    .req-layout { height: 100%; }
    .req-layout.is-wide {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.05fr);
      gap: 0; height: 100%;
    }
    .req-layout.is-wide .req-pane {
      overflow: auto; border-right: 1px solid var(--border); padding: 16px 14px 28px;
    }
    .req-layout.is-wide .req-pane > .inner { max-width: 36rem; }
    .req-layout.is-wide .embed-pane {
      display: flex; flex-direction: column; min-height: 0; background: var(--inset);
    }
    .req-layout:not(.is-wide) .embed-pane { display: none; }

    .muted { color: var(--muted); }
    .t2 { color: var(--text-2); }
    .mono { font-family: var(--mono); }
    .xs { font-size: 11px; }
    .sec { margin-top: 20px; }
    .sec h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-2); }

    .body-box {
      white-space: pre-wrap; border: 1px solid var(--border); background: var(--elevated);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px;
    }

    /* suggest shell */
    .suggest {
      border-radius: var(--radius); border: 1px solid rgba(91,141,239,.3);
      background: var(--accent-soft); padding: 12px; margin-top: 16px;
    }
    .suggest.is-blocked {
      border-color: var(--warning-border); background: var(--warning-soft);
    }
    .suggest-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .suggest-head h2 { margin: 0; font-size: 12px; color: var(--text-2); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 7rem; flex: 1; }
    .field span { font-size: 11px; color: var(--muted); }
    .field input, .field select, .field textarea {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 9px; outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--accent);
    }
    .field textarea { min-height: 72px; resize: vertical; }

    .status-line {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
      font-size: 12px; color: var(--muted);
    }
    .spin {
      width: 12px; height: 12px; border: 2px solid var(--border-strong);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; border-top-color: var(--muted); }
      .device { transition: none; }
    }

    /* blocked panel */
    .block-panel {
      margin-top: 10px; border: 1px solid var(--warning-border);
      background: rgba(0,0,0,.15); border-radius: 8px; padding: 12px;
    }
    .block-panel .title {
      font-size: 13px; font-weight: 650; color: var(--warning); margin: 0 0 4px;
    }
    .block-panel .summary { font-size: 14px; font-weight: 550; margin: 0 0 10px; }
    .block-panel ul { margin: 0 0 10px; padding-left: 1.1rem; color: var(--text-2); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag {
      font-family: var(--mono); font-size: 10.5px; padding: 2px 7px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--elevated); color: var(--muted);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    /* proposal lanes */
    .lane {
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      background: var(--surface); margin-top: 8px;
    }
    .lane-h {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      background: var(--elevated); border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600;
    }
    .lane-badge {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 6px;
    }
    .lane-badge.fe { background: rgba(91,141,239,.15); color: var(--accent); }
    .lane-badge.be { background: rgba(212,160,23,.15); color: var(--warning); }
    .lane-badge.test { background: rgba(61,186,122,.15); color: var(--success); }
    .task-row {
      display: grid; grid-template-columns: 2rem 1fr; gap: 8px;
      padding: 8px 10px; border-top: 1px solid var(--border); font-size: 12px;
    }
    .task-row:first-of-type { border-top: 0; }
    .task-row .no { font-family: var(--mono); color: var(--muted); font-size: 11px; }
    .task-row .prompt { color: var(--text-2); font-size: 11.5px; margin-top: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* embed session */
    .embed-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .embed-bar .live {
      width: 7px; height: 7px; border-radius: 50%; background: var(--success);
      box-shadow: 0 0 0 3px rgba(61,186,122,.2);
    }
    .timeline { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .bubble {
      border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      padding: 10px 12px; max-width: 95%;
    }
    .bubble.agent { border-color: rgba(91,141,239,.35); }
    .bubble .who { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
    .bubble .txt { white-space: pre-wrap; font-size: 12.5px; }
    .tool {
      border-left: 2px solid var(--info); padding: 6px 10px; margin: 4px 0;
      background: rgba(91,184,212,.08); border-radius: 0 6px 6px 0; font-size: 11.5px; color: var(--text-2);
    }
    .embed-foot {
      border-top: 1px solid var(--border); padding: 8px 10px; background: var(--surface);
      display: flex; gap: 8px;
    }
    .embed-foot input { flex: 1; background: var(--elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; }

    /* full session page (narrow URL) */
    .session-page { display: flex; flex-direction: column; height: 100%; }
    .session-page .timeline { padding-bottom: 20px; }

    .ac-list { list-style: none; margin: 0; padding: 0; }
    .ac-list li {
      display: flex; gap: 8px; align-items: flex-start;
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    .ac-list .id { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

    .toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--elevated); border: 1px solid var(--border-strong);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; z-index: 50;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }

    .empty-embed {
      flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center;
      padding: 24px; font-size: 12px;
    }
  </style>
</head>
<body class="force-wide">
  <div class="lab">
    <strong style="font-size:12px">交互实验室</strong>
    <label>视口
      <select id="viewport">
        <option value="wide" selected>宽屏（嵌入会话）</option>
        <option value="narrow">窄屏（URL 跳转）</option>
        <option value="auto">跟窗口宽度（≥900=宽）</option>
      </select>
    </label>
    <label>场景
      <select id="scene">
        <option value="gate">入口闸：缺分支</option>
        <option value="running">拆分中（可看嵌入/跳转）</option>
        <option value="blocked">Agent blocked 打磨</option>
        <option value="proposal">有 proposal 打磨</option>
      </select>
    </label>
    <span class="url" id="urlBar">#/requirements/req_demo</span>
    <span class="hint">点「让 Agent 拆分 / 查看会话 / 返回」体验路由</span>
  </div>

  <div class="stage-wrap">
    <div class="device" id="device">
      <div class="app" id="app"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /** 简易 hash 路由 + 状态机，模拟 pieqi 需求详情 ↔ 拆分会话 */
    const state = {
      scene: 'gate',
      viewport: 'wide', // wide | narrow | auto
      branch: '',
      candidate: 'feat/auth-refresh',
      acText: '',
      body: '登录态刷新偶发 401。需要在网关与前端统一处理，并补回归。',
      suggestTaskId: 'task_split_9f2a',
      route: { name: 'requirement', id: 'req_demo' }, // or session
    };

    const $ = (s, el = document) => el.querySelector(s);
    const toast = (msg) => {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 1800);
    };

    function isWide() {
      if (state.viewport === 'wide') return true;
      if (state.viewport === 'narrow') return false;
      return window.innerWidth >= 900;
    }

    function syncUrlBar() {
      let path = `#/requirements/${state.route.id}`;
      if (state.route.name === 'session') {
        path = `#/sessions/${state.suggestTaskId}?from=requirement&requirement_id=${state.route.id}`;
      }
      $('#urlBar').textContent = path;
      if (location.hash !== path) {
        history.replaceState(null, '', path);
      }
    }

    function parseHash() {
      const h = location.hash || '#/requirements/req_demo';
      const mSess = h.match(/^#\/sessions\/([^?]+)/);
      if (mSess) {
        state.route = { name: 'session', id: 'req_demo' };
        state.suggestTaskId = decodeURIComponent(mSess[1]);
        return;
      }
      const mReq = h.match(/^#\/requirements\/([^/?]+)/);
      state.route = { name: 'requirement', id: mReq ? decodeURIComponent(mReq[1]) : 'req_demo' };
    }

    function goRequirement() {
      state.route = { name: 'requirement', id: 'req_demo' };
      syncUrlBar();
      render();
    }

    function goSession() {
      if (isWide() && state.scene === 'running') {
        // 宽屏：不跳转，只滚动/聚焦嵌入区
        toast('宽屏：会话已嵌在右侧，不跳 URL');
        syncUrlBar(); // 仍停在 requirement
        const pane = $('.embed-pane');
        if (pane) pane.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
      state.route = { name: 'session', id: 'req_demo' };
      syncUrlBar();
      render();
    }

    function startSuggest() {
      if (!state.branch.trim()) {
        state.scene = 'gate';
        $('#scene').value = 'gate';
        toast('409 integration_branch_required → 停在打磨闸');
        render();
        return;
      }
      state.scene = 'running';
      $('#scene').value = 'running';
      toast(isWide() ? '拆分中：右侧嵌入会话' : '拆分中：可点「查看会话」跳 URL');
      render();
      // 演示：2.4s 后自动出 blocked 或 proposal（交替）
      clearTimeout(startSuggest._t);
      startSuggest._t = setTimeout(() => {
        if (state.scene !== 'running') return;
        state.scene = state.body.includes('401') && !state.acText.trim() ? 'blocked' : 'proposal';
        $('#scene').value = state.scene;
        if (!isWide() && state.route.name === 'session') {
          // 窄屏在会话页时，出结果后提示回需求页打磨
          toast('拆分结束：回需求页打磨');
        } else {
          toast(state.scene === 'blocked' ? '结果：blocked' : '结果：proposal');
        }
        render();
      }, 2400);
    }

    function savePolish(andSuggest) {
      const branch = $('#f-branch')?.value?.trim() || '';
      const ac = $('#f-ac')?.value || '';
      const body = $('#f-body')?.value || state.body;
      state.branch = branch;
      state.acText = ac;
      state.body = body;
      toast(andSuggest ? 'PATCH 已保存 → 重新拆分' : 'PATCH 已保存');
      if (andSuggest) startSuggest();
      else render();
    }

    function discardBlock() {
      state.scene = state.branch ? 'gate' : 'gate';
      // empty-ish
      if (state.branch) state.scene = 'proposal'; // won't show if no nodes — use empty
      state.scene = 'gate';
      $('#scene').value = 'gate';
      // if has branch, show empty suggest (reuse gate panel only when no branch)
      if (state.branch) {
        state.scene = 'empty';
      }
      toast('已丢弃 blocked / 提案');
      render();
    }

    function confirmProposal() {
      toast('Confirm 落地 → planned 任务');
      state.scene = 'empty';
      $('#scene').value = 'gate';
      render();
    }

    function timelineHTML() {
      return `
        <div class="bubble agent">
          <div class="who">claude · 拆分助手</div>
          <div class="txt">正在阅读需求与流程包 split_instructions…</div>
        </div>
        <div class="tool">Read · docs/CONTEXT.md</div>
        <div class="tool">Bash · git rev-parse --abbrev-ref HEAD</div>
        <div class="bubble agent">
          <div class="who">claude · 拆分助手</div>
          <div class="txt">${state.scene === 'running'
            ? '核对合入面与 AC 是否足够拆票…'
            : state.scene === 'blocked'
              ? '信息不足，将输出 kind=blocked（不会猜分支）。'
              : '将输出 kind=proposal 节点图。'}</div>
        </div>
      `;
    }

    function embedPaneHTML() {
      if (state.scene !== 'running') {
        return `<div class="empty-embed">拆分会话空闲<br/><span class="xs">点击「让 Agent 拆分」后此处嵌入时间线</span></div>`;
      }
      return `
        <div class="embed-bar">
          <span class="live" title="running"></span>
          <strong style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            [pieqi-split] 登录态 401 统一处理
          </strong>
          <span class="xs muted mono">${state.suggestTaskId}</span>
          <button class="btn btn-sm btn-ghost" type="button" data-act="open-session-url">新开页</button>
        </div>
        <div class="timeline">${timelineHTML()}</div>
        <div class="embed-foot">
          <input placeholder="干预（演示只读）" disabled />
          <button class="btn btn-sm" disabled>发送</button>
        </div>
      `;
    }

    function sessionPageHTML() {
      return `
        <div class="session-page">
          <header class="hdr">
            <button class="icon-btn" type="button" data-act="back-req" aria-label="返回需求">←</button>
            <h1>[pieqi-split] 登录态 401 统一处理</h1>
            <span class="pill">running</span>
          </header>
          <div class="timeline scroll">${timelineHTML()}
            <p class="xs muted" style="padding:0 4px">窄屏：完整会话页 · URL 已变更为 /sessions/… · 返回回到需求详情打磨</p>
          </div>
          <div class="embed-foot">
            <input placeholder="干预（演示只读）" disabled />
            <button class="btn btn-sm" disabled>发送</button>
          </div>
        </div>
      `;
    }

    function blockedPanelHTML(mode) {
      const title = mode === 'gate' ? '先登记合入分支' : '还不能拆';
      const summary = mode === 'gate'
        ? '未登记需求分支，不能开拆分会话（避免 Agent 猜「当前分支」）。'
        : '合入面与验收未钉死，禁止硬给可落地拆分。';
      const reasons = mode === 'gate'
        ? ['integration_branch 为空', '入口闸 409，未创建拆分 task']
        : ['需求未写清合入目标', 'AC 为空，无法 covers_ac', '范围可能跨网关与前端'];
      const questions = mode === 'gate'
        ? ['合入目标是主仓哪条分支？']
        : ['合入目标是否为 feat/auth-refresh？', 'AC 是否包含「刷新后 401 不再穿透到业务页」？'];
      const missing = mode === 'gate' ? ['integration_branch'] : ['integration_branch', 'acceptance', 'scope'];
      return `
        <div class="block-panel">
          <p class="title">${title}</p>
          <p class="summary">${summary}</p>
          <ul>${reasons.map((r) => `<li>${r}</li>`).join('')}</ul>
          <p class="xs t2" style="margin:0 0 6px;font-weight:600">需要你回答</p>
          <ul>${questions.map((q) => `<li>${q}</li>`).join('')}</ul>
          <div class="tags">${missing.map((m) => `<span class="tag">${m}</span>`).join('')}</div>
          <div class="field" style="margin-bottom:8px">
            <span>需求分支</span>
            <input id="f-branch" value="${escapeAttr(state.branch || state.candidate)}" placeholder="如 feat/…" />
          </div>
          <div class="field" style="margin-bottom:8px">
            <span>验收 AC（一行一条）</span>
            <textarea id="f-ac" placeholder="刷新 token 失败时统一跳登录">${escapeAttr(state.acText)}</textarea>
          </div>
          <div class="field">
            <span>说明</span>
            <textarea id="f-body">${escapeAttr(state.body)}</textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="button" data-act="save-resuggest">保存并重新拆分</button>
            <button class="btn btn-ghost" type="button" data-act="save-only">仅保存</button>
            <button class="btn btn-ghost" type="button" data-act="discard">丢弃</button>
          </div>
        </div>
      `;
    }

    function proposalHTML() {
      return `
        <p class="xs muted" style="margin:10px 0 0">打磨执行方案（改票 / 依赖 / Agent）→ 确认落地</p>
        <div class="lane">
          <div class="lane-h"><span class="lane-badge fe">fe · 1</span> 前端统一 401</div>
          <div class="task-row">
            <div class="no">#1</div>
            <div>
              <strong>拦截器收敛刷新逻辑</strong>
              <div class="prompt">在 axios 拦截器单点处理 refresh；业务页不再各自 catch 401。</div>
            </div>
          </div>
        </div>
        <div class="lane">
          <div class="lane-h"><span class="lane-badge be">be · 1</span> 网关错误码</div>
          <div class="task-row">
            <div class="no">#2</div>
            <div>
              <strong>刷新失败返回约定码</strong>
              <div class="prompt">文档化并实现 refresh 失败错误体；depends #1 可并行设计。</div>
            </div>
          </div>
        </div>
        <div class="lane">
          <div class="lane-h"><span class="lane-badge test">test · 1</span> 回归</div>
          <div class="task-row">
            <div class="no">#3</div>
            <div>
              <strong>组件测 + 隔离功能测</strong>
              <div class="prompt">依赖 #1 #2 合入需求分支后跑；勿占现网面板。</div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="button" data-act="confirm">确认落地</button>
          <button class="btn btn-ghost btn-sm" type="button" data-act="discard">丢弃方案</button>
        </div>
      `;
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    function suggestBodyHTML() {
      const scene = state.scene;
      const blockedShell = scene === 'gate' || scene === 'blocked';
      let sub = '';
      if (scene === 'running') {
        sub = `
          <div class="status-line">
            <span class="spin"></span>
            Agent 正在生成 Task List
            <a href="#" data-act="view-session">查看会话</a>
          </div>
          ${!isWide() ? `<p class="xs muted" style="margin:8px 0 0">窄屏：点「查看会话」会改 URL 到 /sessions/…</p>` : `<p class="xs muted" style="margin:8px 0 0">宽屏：会话嵌在右侧，URL 留在需求页</p>`}
        `;
      } else if (scene === 'gate') {
        sub = blockedPanelHTML('gate');
      } else if (scene === 'blocked') {
        sub = blockedPanelHTML('blocked');
      } else if (scene === 'proposal') {
        sub = proposalHTML();
      } else {
        sub = `<p class="xs muted" style="margin:10px 0 0">未拆或已丢弃。${state.branch ? '' : '请先登记分支。'}</p>`;
        if (!state.branch) sub = blockedPanelHTML('gate');
      }

      return `
        <section class="suggest ${blockedShell ? 'is-blocked' : ''}">
          <div class="suggest-head">
            <h2>Agent 拆分建议</h2>
            <span class="xs muted">钉死合入面 → 出方案或说明缺口 → 打磨后落地</span>
          </div>
          ${state.branch ? `<p class="xs mono muted" style="margin:0 0 8px">需求分支 · ${escapeAttr(state.branch)}</p>` : ''}
          <div class="row">
            <label class="field">
              <span>Agent</span>
              <select><option>claude</option><option>cursor</option></select>
            </label>
            <label class="field">
              <span>模型</span>
              <select><option>默认</option><option>sonnet</option></select>
            </label>
            <button class="btn btn-primary" type="button" data-act="suggest"
              ${scene === 'running' ? 'disabled' : ''}>
              ${scene === 'running' ? '拆分中…' : scene === 'proposal' || scene === 'blocked' ? '重新生成建议' : '让 Agent 拆分'}
            </button>
          </div>
          ${sub}
        </section>
      `;
    }

    function requirementHTML() {
      const wide = isWide();
      return `
        <div class="req-layout ${wide ? 'is-wide' : ''}">
          <div class="${wide ? 'req-pane' : 'scroll'}">
            <div class="${wide ? 'inner' : 'col'}">
              <header class="hdr" style="margin:0 -${wide ? '14px' : '12px'} 12px;padding-left:12px;padding-right:12px">
                <button class="icon-btn" type="button" aria-label="返回">←</button>
                <h1>登录态刷新偶发 401</h1>
                <span class="pill">草案</span>
                <button class="btn btn-sm" type="button">＋ 新建需求</button>
              </header>
              <p class="xs muted" style="margin:0">D:/code/go/pieqi</p>
              <section class="sec">
                <h2>原始需求</h2>
                <div class="body-box">${escapeAttr(state.body)}</div>
              </section>
              ${suggestBodyHTML()}
              <section class="sec">
                <h2>验收（AC）</h2>
                ${state.acText.trim()
                  ? `<ul class="ac-list">${state.acText.split('\n').filter(Boolean).map((line, i) =>
                      `<li><span class="id">ac${i + 1}</span><span>${escapeAttr(line)}</span></li>`).join('')}</ul>`
                  : `<p class="xs muted">零 AC（可在打磨区补）</p>`}
              </section>
              <section class="sec">
                <h2>任务图</h2>
                <p class="xs muted">尚无执行任务 — 确认上方拆分建议即可生成</p>
              </section>
            </div>
          </div>
          ${wide ? `<aside class="embed-pane">${embedPaneHTML()}</aside>` : ''}
        </div>
      `;
    }

    function render() {
      const app = $('#app');
      if (state.route.name === 'session') {
        // 若用户把视口切回宽屏，自动回到嵌入态
        if (isWide()) {
          state.route = { name: 'requirement', id: 'req_demo' };
          toast('已切宽屏：回到需求页嵌入');
        } else {
          app.innerHTML = sessionPageHTML();
          bind(app);
          syncUrlBar();
          return;
        }
      }
      app.innerHTML = requirementHTML();
      bind(app);
      syncUrlBar();
    }

    function bind(root) {
      root.addEventListener('click', (e) => {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        e.preventDefault();
        const act = t.getAttribute('data-act');
        if (act === 'suggest') startSuggest();
        if (act === 'view-session' || act === 'open-session-url') goSession();
        if (act === 'back-req') goRequirement();
        if (act === 'save-resuggest') savePolish(true);
        if (act === 'save-only') savePolish(false);
        if (act === 'discard') discardBlock();
        if (act === 'confirm') confirmProposal();
      });
    }

    $('#viewport').addEventListener('change', (e) => {
      state.viewport = e.target.value;
      document.body.classList.remove('force-wide', 'force-narrow', 'force-auto');
      document.body.classList.add(
        state.viewport === 'wide' ? 'force-wide'
          : state.viewport === 'narrow' ? 'force-narrow' : 'force-auto'
      );
      render();
    });
    $('#scene').addEventListener('change', (e) => {
      state.scene = e.target.value;
      if (state.scene === 'gate') state.branch = '';
      if (state.scene === 'blocked' || state.scene === 'running' || state.scene === 'proposal') {
        if (!state.branch) state.branch = state.candidate;
      }
      if (state.scene === 'proposal' && !state.acText.trim()) {
        state.acText = '刷新失败统一跳登录\n业务页不再散落 401 处理';
      }
      state.route = { name: 'requirement', id: 'req_demo' };
      render();
    });
    window.addEventListener('hashchange', () => { parseHash(); render(); });
    window.addEventListener('resize', () => {
      if (state.viewport === 'auto') render();
    });

    parseHash();
    render();
  </script>
</body>
</html>
