id: s1-plan-serial
version: "1"
label: "S1 · plan then serial"
short_label: S1
description: "Optional design → 1–2 serial implement tickets → optional verify. No FE/BE hard split."
tags: [few tickets, serial, no FE/BE split]
ui_steps:
  - { id: design, label: Design }
  - { id: implement, label: Implement }
  - { id: verify, label: Verify }
  - { id: outcome, label: Close }
gates:
  max_nodes: 5
  max_parallel_implement: 1
  forbid_fe_be_hard_split: true
  require_ac_evidence_to_done: true
  path_bias: light_req
  require_brief_in_prompt: true
split_instructions: |
  4. **Split philosophy (S1)**: Prefer few tickets:
     - 0–1 design (omit if design doc already exists)
     - 1–2 implement tickets (role=other or by module; **do not** split frontend+backend as craft tickets)
     - 0–1 test (depends_on all implements)
     Same-requirement implement tickets must chain via depends_on; no parallel first-wave implements.
     Only split further when context degrades or file sets are disjoint; state the reason in the prompt.
  5. No empty prompts; each must be runnable and include Done=.
  6. **Delivery**: implement merges to req branch; unit tests only on implement; test waits on depends_on.
  7. **Must blocked when unclear**: If scope / integration branch / acceptance is unclear, output kind=blocked
     (summary + reasons + questions + missing). Do NOT guess a branch. Do NOT use pieqi/ worktree branches
     as the merge target. Never invent a hard-split proposal when blocked.
brief_header: |
  Stakes: low | high
  Hypothesis: ...
  Goal / out of scope: ...
  Done = <command or AC id + how to verify>
  Mode: do-it
  Handoff: read docs/handoff/req-<id8>.md if present; write back conclusions + evidence only
dod_implement: |

  ## delivery (implement)

  1. Work in this task worktree; **merge into the requirement integration branch** when done.
  2. Self-test = unit/component tests only. Do not start the system under test as completion criteria.
     If this repo is pieqi: do not start the pieqi service as completion criteria.
  3. Sandbox/test failures => do not mark completed; leave evidence.
  4. Ticket completed means merged to req branch, not "session finished".
  5. Read req handoff if present; write back conclusions + evidence.
dod_test: |

  ## delivery (test)

  1. Wait until depends_on are done and merged to req branch before functional tests.
  2. Functional test: checkout req branch → build → **isolated run environment for that project**
     (port/config/HOME decided by the target project).
     If this repo is pieqi, use a separate PIEQI_HOME + PIEQI_SERVER_PORT; do not occupy production :3000 / ~/.pieqi.
  3. Report must include "总评：FAIL" on failure. Do not mark completed on FAIL.
  4. Do not shorten approval timeout or auto-approve to fake a green test.
