server:
  port: 3000
  mode: debug

channels:
  lark:
    enabled: true
    # event_mode: webhook(默认,需公网回调) | longconn(长连接,无需公网,推荐)
    event_mode: longconn
    # 长连接模式只需 app_id+app_secret;webhook 模式还需 verify_token+encrypt_key
    app_id: ""
    app_secret: ""
    verify_token: ""
    encrypt_key: ""
    # 一键接入(扫码)拿到的凭据会写入这里,覆盖上面的 app_id/app_secret。
    # 空 = ~/.pieqi/lark_credentials.json。详见 /api/larkreg/start。
    credentials_file: ""
  wecom:
    enabled: false
  wechat:
    enabled: false     # 演示用：关掉 wechat 避免扫码阻塞，只看 Pieqi 后端 + PWA
    base_url: ""  # 默认 https://ilinkai.weixin.qq.com

# Pieqi 后端：worktree 并行任务 + 移动端监控 PWA
api:
  enabled: true
  token: ""           # 空 = 不鉴权（仅本地）；绑 0.0.0.0 必须设
  cors_origins: []    # 空 = 允许所有（本地 dev）

pieqi:
  enabled: true                  # 总开关；开启后 IM 消息走 TaskCreator
  # 运行时数据根目录：留空 = ~/.pieqi（或环境变量 PIEQI_HOME 覆盖）。
  # tasks/worktrees/sessions 等全部数据存到用户主目录，不入仓库。
  worktree_base: ""              # worktree 根目录；留空默认 ~/.pieqi/worktrees
  skills_dirs: []                # 空 = 默认 ~/.claude/skills + CLAUDE_CONFIG_DIR/.claude/skills
  permission_mode: bypassPermissions  # claude 自身不拦，由 PreToolUse hook 拦截
  cleanup_worktrees: true        # 任务完成即清 worktree
  hook_timeout: 30m              # hook 等人类决策的上限
  hook_tools: [Bash, Write, Edit, NotebookEdit]  # PreToolUse 拦截的工具；读类不拦
  max_concurrent_per_project: 4
  base_branch: master            # worktree 基准分支；本机 pieqi 主分支为 master
  # ACP 协议（Phase 2）—— 已弃用（P5）：将迁移到下方 agents.* 节。
  # use_acp=true 时 agent 驱动走 AgentAdapter（ACPAgent）；false 保持 claude -p 路径。
  # 显式配置本节的任何字段都会触发弃用告警（旧语义暂仍生效，直到 TaskRunner 接入 agents.*）。
  acp:
    use_acp: true                   # 弃用：迁移到 agents.claude.transport
    agent_type: claude-code         # 弃用：claude-code → agents.claude；qodercli → agents.qoder.acp
    acp_spawn_command: []           # 弃用：迁移到 agents.qoder.acp.spawn_command
    init_timeout: 30s               # 弃用：迁移到 agents.qoder.acp.init_timeout
    idle_timeout: 15m               # 弃用：迁移到 agents.qoder.acp.idle_timeout

# 多 Agent（multi-agent.md §9）：与 pieqi.acp.* 旧字段并存，新增节不改旧语义。
# 旧字段迁移（agents.claude/qoder 接管 acp.use_acp 等）在 P5 单独做。
agents:
  claude:
    transport: sdk-bridge           # sdk-bridge(默认,官方 Agent SDK 常驻桥) | print(直连 claude -p)
    bridge:
      base_url: "http://127.0.0.1:18790"  # 桥监听地址；改端口需与 auto_start 同步
      token: ""                     # 桥鉴权 token（空 = 不鉴权，仅本地私有端口）；建议设
      auto_start: true              # 探活失败自动 spawn node src/index.js（桥源码随服务同装）
      # dir: ""                     # 桥源码目录(含 src/index.js)；空 = 自动探测(exe/cwd 邻接 services/claude-sdk-bridge)
    print:
      command: claude               # bridge 不可用时的 print 回退
      permission_mode: bypassPermissions
      model: ""
      sys_prompt: ""
  qoder:
    transport: acp                  # acp(默认, qodercli --acp)
    acp:
      agent_type: qodercli
      spawn_command: []             # 空 = 按 agent_type 取默认；如 ["qodercli","--acp","--port","1234"]
      init_timeout: 30s
      idle_timeout: 15m

# 飞书身份绑定 + Cloudflared 临时隧道安全系统（PRD §8）
auth:
  debug_skip_all_auth: false           # true = 跳过所有鉴权（仅本地开发）
  feishu_binding_file: ""              # 空 = ~/.pieqi/feishu_binding.json
  cloudflared:
    binary_path: cloudflared           # PATH 中查找；或绝对路径 /usr/local/bin/cloudflared
    default_ttl: 15m                   # 15m | 1h | 4h
  ratelimit:
    max_failures_per_min: 5            # 5 次/分钟 → 拉黑
    blacklist_duration: 10m            # 拉黑 10 分钟
