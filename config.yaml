server:
  port: 3000
  mode: debug

channels:
  lark:
    enabled: false
    app_id: ""
    app_secret: ""
    verify_token: ""
    encrypt_key: ""
  wecom:
    enabled: false
  wechat:
    enabled: false     # 演示用：关掉 wechat 避免扫码阻塞，只看 Pieqi 后端 + PWA
    base_url: ""  # 默认 https://ilinkai.weixin.qq.com

# Pieqi 后端：worktree 并行任务 + 移动端监控 PWA
api:
  enabled: true
  token: ""           # 空 = 不鉴权（仅本地）；绑 0.0.0.0 必须设
  cors_origins: []    # 空 = 允许所有（本地 dev）

pieqi:
  enabled: true                  # 总开关；开启后 IM 消息走 TaskCreator
  worktree_base: ./data/worktrees
  skills_dirs: []                # 空 = 默认 ~/.claude/skills + CLAUDE_CONFIG_DIR/.claude/skills
  permission_mode: bypassPermissions  # claude 自身不拦，由 PreToolUse hook 拦截
  cleanup_worktrees: true        # 任务完成即清 worktree
  hook_timeout: 30m              # hook 等人类决策的上限
  hook_tools: [Bash, Write, Edit, NotebookEdit]  # PreToolUse 拦截的工具；读类不拦
  max_concurrent_per_project: 4
  base_branch: master            # worktree 基准分支；本机 pieqi 主分支为 master
  # ACP 协议（Phase 2）：use_acp=true 时 agent 驱动走 AgentAdapter（ACPAgent），
  # false（默认）保持 Phase 1 的 claude -p + stream-json 路径不变。
  # agent_type 选 claude-code（经官方 TS 适配器）/ qodercli / codex / 其他原生 ACP agent。
  # acp_spawn_command 留空则按 agent_type 取默认；非空则整体覆盖（如自定义适配器路径）。
  acp:
    use_acp: true                   # 切 true 启用 ACP 路径（claude-code TS 适配器）
    agent_type: claude-code         # claude-code | qodercli | codex | <其他>
    # 本机 Go spawn `npx` 会永久挂死（batch shim + FOR /F 无控制台，零输出），ACP 握手必 30s 超时回退。
    # 修复：直接 `node` 拉起已全局安装的 @agentclientprotocol/claude-agent-acp，绕开 npx。
    # 安装方式：npm i -g @agentclientprotocol/claude-agent-acp@0.67.0
    acp_spawn_command: ["node", "F:\\appData\\Roaming\\npm\\node_modules\\@agentclientprotocol\\claude-agent-acp\\dist\\index.js"]
    init_timeout: 30s               # initialize / newSession 握手超时
